name: Scorecard supply-chain analysis

on:
  # Scorecard runs on a schedule; PR runs are advisory only.
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@46dc3187a971a9febf3aeb7f94ccde489f7bb46a # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: ${{ github.event_name == 'push' }}

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3 — full commit SHA of the v3 tag tip, verified to resolve via the GitHub API (2026-10-15). The previous line omitted both the `@` separator and the `/upload-sarif` subpath.
        with:
          category: scorecard
          sarif_file: scorecard-results.sarif
