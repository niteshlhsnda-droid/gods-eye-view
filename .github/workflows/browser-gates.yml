name: Browser gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-and-a11y:
    name: Playwright smoke + axe accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEV_REQUIRE_ALLOCATION_GATE: '0'
      GEV_NO_WEBSERVER: '1'
      GEV_BASE_URL: http://localhost:4173
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start the preview server
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Smoke test (page loads, globe renders, zero console errors)
        run: npx playwright test tests/smoke.spec.mjs

      - name: axe-core accessibility audit (no critical violations)
        run: npx playwright test tests/axe-audit.spec.mjs

      - name: Preview server log
        if: failure()
        run: cat preview.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gates-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
