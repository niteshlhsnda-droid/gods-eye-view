<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contributors — God's Eye View</title>
    <meta
      name="description"
      content="Community contributor leaderboard for the God's Eye View fork."
    />
    <style>
      :root {
        --bg: #05070f;
        --panel: #0b1020;
        --line: rgba(0, 255, 255, 0.14);
        --text: #d7f9ff;
        --dim: rgba(215, 249, 255, 0.55);
        --accent: #00e5ff;
        --gold: #ffd166;
        --silver: #c0c8d4;
        --bronze: #e0a458;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        min-height: 100vh;
      }
      header { border-bottom: 1px solid var(--line); padding: 20px 24px; }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0.18em; }
      h1 .accent { color: var(--accent); }
      .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
      main { padding: 24px; max-width: 900px; margin: 0 auto; }
      .banner {
        border: 1px dashed var(--line); border-radius: 8px;
        padding: 10px 14px; color: var(--dim); font-size: 12px; margin-bottom: 18px;
      }
      .banner.warn { border-color: var(--gold); color: var(--gold); }
      ol.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      .row {
        display: flex; align-items: center; gap: 14px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px 16px;
      }
      .rank { font-size: 18px; width: 40px; text-align: center; color: var(--dim); }
      .rank.r1 { color: var(--gold); } .rank.r2 { color: var(--silver); }
      .rank.r3 { color: var(--bronze); }
      .avatar { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); }
      .who { flex: 1; min-width: 0; }
      .who a { color: var(--text); text-decoration: none; font-size: 14px; }
      .who a:hover { color: var(--accent); }
      .who .type { color: var(--dim); font-size: 11px; }
      .count { font-size: 16px; color: var(--accent); white-space: nowrap; }
      .count small { color: var(--dim); font-size: 10px; display: block; text-align: right; }
      footer { padding: 18px 24px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
      a { color: var(--accent); }
      .refresh { background: none; border: 1px solid var(--line); color: var(--text);
        border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>CONTRIBUTOR <span class="accent">LEADERBOARD</span></h1>
      <div class="sub">niteshlhsnda-droid/gods-eye-view · via the public GitHub API · no login needed</div>
    </header>
    <main>
      <div class="banner" id="banner">Loading contributors…</div>
      <ol class="board" id="board"></ol>
      <p style="margin-top:18px"><button class="refresh" id="refresh">refresh</button></p>
    </main>
    <footer>
      <a href="./pulse.html">World Pulse</a> ·
      <a href="https://github.com/niteshlhsnda-droid/gods-eye-view/graphs/contributors">full history on GitHub</a>
    </footer>
    <script>
      'use strict';
      var API = 'https://api.github.com/repos/niteshlhsnda-droid/gods-eye-view/contributors?per_page=100';
      var CACHE_KEY = 'gev:contributors:v1';
      var CACHE_TTL_MS = 24 * 60 * 60 * 1000;

      function readCache() {
        try {
          var raw = window.localStorage.getItem(CACHE_KEY);
          if (!raw) return null;
          var parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.contributors)) return null;
          if (Date.now() - parsed.cachedAt > CACHE_TTL_MS) return null;
          return parsed;
        } catch (e) { return null; }
      }

      function writeCache(contributors, remaining) {
        try {
          window.localStorage.setItem(CACHE_KEY, JSON.stringify({
            cachedAt: Date.now(),
            rateLimitRemaining: remaining,
            contributors: contributors,
          }));
        } catch (e) { /* storage full/blocked — fine */ }
      }

      function render(contributors, bannerText, warn) {
        var banner = document.getElementById('banner');
        banner.textContent = bannerText;
        banner.className = 'banner' + (warn ? ' warn' : '');
        var board = document.getElementById('board');
        board.innerHTML = '';
        contributors.forEach(function (person, index) {
          var li = document.createElement('li');
          li.className = 'row';
          var rank = document.createElement('div');
          rank.className = 'rank' + (index < 3 ? ' r' + (index + 1) : '');
          rank.textContent = '#' + (index + 1);
          var img = document.createElement('img');
          img.className = 'avatar';
          img.alt = '';
          img.loading = 'lazy';
          img.src = person.avatar_url + '&s=88';
          var who = document.createElement('div');
          who.className = 'who';
          var link = document.createElement('a');
          link.href = person.html_url;
          link.rel = 'noopener';
          link.textContent = person.login;
          who.appendChild(link);
          var type = document.createElement('div');
          type.className = 'type';
          type.textContent = person.type === 'Bot' ? 'bot' : 'contributor';
          who.appendChild(type);
          var count = document.createElement('div');
          count.className = 'count';
          count.textContent = person.contributions;
          var label = document.createElement('small');
          label.textContent = 'commits';
          count.appendChild(label);
          li.appendChild(rank);
          li.appendChild(img);
          li.appendChild(who);
          li.appendChild(count);
          board.appendChild(li);
        });
        if (contributors.length === 0) {
          var empty = document.createElement('p');
          empty.textContent = 'No contributor data available right now.';
          board.appendChild(empty);
        }
      }

      function refresh() {
        var banner = document.getElementById('banner');
        banner.textContent = 'Loading contributors…';
        banner.className = 'banner';
        fetch(API, { headers: { Accept: 'application/vnd.github+json' } })
          .then(function (res) {
            var remaining = res.headers.get('x-ratelimit-remaining');
            if (res.status === 403) {
              var cached = readCache();
              if (cached) {
                render(cached.contributors,
                  'GitHub rate limit reached — showing cached data from ' +
                  new Date(cached.cachedAt).toLocaleString() + '.', true);
              } else {
                render([], 'GitHub rate limit reached and no cached data is available. Try again later.', true);
              }
              return null;
            }
            if (!res.ok) throw new Error('http ' + res.status);
            return res.json().then(function (json) {
              writeCache(json, remaining);
              render(json, 'Live from the GitHub API · ' +
                json.length + ' contributors · rate-limit remaining: ' +
                (remaining == null ? 'unknown' : remaining) + '.', false);
            });
          })
          .catch(function () {
            var cached = readCache();
            if (cached) {
              render(cached.contributors,
                'Offline or API unreachable — showing cached data from ' +
                new Date(cached.cachedAt).toLocaleString() + '.', true);
            } else {
              render([], 'Offline and no cached data. Check your connection and retry.', true);
            }
          });
      }

      document.getElementById('refresh').addEventListener('click', refresh);
      refresh();
    </script>
  </body>
</html>
