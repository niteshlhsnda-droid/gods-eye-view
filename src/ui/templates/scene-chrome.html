  <div id="cesiumContainer"></div>
  <div id="world-overlay-root" aria-hidden="true">
    <canvas id="world-overlay-canvas"></canvas>
  </div>
  <div id="world-overlay-actions" class="world-overlay-accessibility" role="region" aria-label="Visible map targets">
    <div id="world-overlay-action-list"></div>
    <div id="world-overlay-status" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- Title -->
  <div id="title-bar">
    <div class="title-glow"></div>
    <h1><span class="title-logo brand-logo" data-logo-gaze data-logo-src="/logo.svg" aria-hidden="true"><img src="/logo.svg" alt="" /></span> <span>GOD'S EYE <span class="title-accent">VIEW</span></span></h1>
    <p class="subtitle" data-i18n="app.subtitle">NO PLACE LEFT BEHIND</p>
  </div>

  <!-- Style indicator -->
  <div id="style-indicator">
    <span class="indicator-label" data-i18n="style.activeStyle">ACTIVE STYLE</span>
    <span class="indicator-value" id="active-style-name">NORMAL</span>
  </div>

  <!-- Top-center camera and share actions -->
  <nav id="top-center-actions" aria-label="Globe actions">
    <button id="clear-selected-layers" type="button" aria-label="Clear selected data layers" data-i18n-aria-label="actions.clearLayers" title="Turn off all selected data layers">
      <span class="material-symbols-outlined" aria-hidden="true">layers_clear</span>
    </button>
    <button id="share-btn" type="button" aria-label="Share this scene" data-i18n-aria-label="actions.share" title="Share this scene" data-i18n-title="actions.share">
      <span class="share-icon" aria-hidden="true">&#x1F517;</span>
    </button>
    <button id="story-mode-btn" type="button" aria-label="Story mode" data-i18n-aria-label="actions.story" title="Story mode" data-i18n-title="actions.storyTitle">
      <span class="material-symbols-outlined" aria-hidden="true">auto_stories</span>
    </button>
    <button id="alert-me-btn" type="button" aria-label="Alert me" data-i18n-aria-label="actions.alertMe" title="Alert me" data-i18n-title="actions.alertMeTitle">
      <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
    </button>
    <button id="live-now-btn" type="button" aria-label="Live Now" title="Live Now — what's happening on Earth right now" aria-expanded="false">
      <span class="material-symbols-outlined" aria-hidden="true">public</span>
      <span class="live-now-dot" aria-hidden="true" hidden></span>
    </button>
    <button id="tilt-map-view" type="button" aria-label="Tilt map to oblique view" data-i18n-aria-label="actions.tiltView" title="Toggle straight-down and tilted map views" data-i18n-title="actions.tilt" aria-pressed="false">
      <span class="material-symbols-outlined" aria-hidden="true">view_in_ar</span>
    </button>
    <button id="north-up-view" type="button" aria-label="Reset map to north up" data-i18n-aria-label="actions.northUpView" title="Reset map bearing to north" data-i18n-title="actions.northUp">
      <span class="camera-compass-n" aria-hidden="true">N</span>
      <span class="camera-compass-needle material-symbols-outlined" aria-hidden="true">navigation</span>
    </button>
    <button id="reset-globe-view" type="button" aria-label="Reset to full globe view" data-i18n-aria-label="actions.resetGlobeView" title="Reset camera and return to full globe view" data-i18n-title="actions.resetGlobe">
      <span class="material-symbols-outlined" aria-hidden="true">public</span>
    </button>
  </nav>
  <div id="global-loading-status" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span id="global-loading-label" data-i18n="loading.liveData">LOADING LIVE DATA</span>
    <span id="global-loading-detail"></span>
  </div>
  <div id="traffic-sync-chip" aria-live="polite">
    <span id="traffic-sync-label">syncing road network</span>
    <span id="traffic-sync-progress">0%</span>
  </div>
  <div id="cctv-sync-chip" aria-live="polite">
    <span id="cctv-sync-label">loading frames</span>
    <span id="cctv-sync-progress">0/0</span>
  </div>

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Safe frame guides for recording composition -->
  <div id="safe-frame-overlay">
    <div id="safe-frame-box"></div>
  </div>
